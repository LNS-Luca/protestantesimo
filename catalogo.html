<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Movimenti | Protestantesimo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --avorio: #FBF9F1;
            --navy: #112D4E;
            --navy-light: #3F72AF;
            --legno: #8B5E34;
            --accento-hover: #DBE2EF;
        }

        body {
            background-color: var(--avorio);
            font-family: 'Montserrat', sans-serif;
            color: #333;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, .navbar-brand {
            font-family: 'Lora', serif;
        }

        /* Navigazione */
        .navbar {
            background-color: transparent !important;
            position: absolute;
            width: 100%;
            z-index: 10;
            padding: 1.5rem 0;
        }

        .navbar-brand {
            font-weight: 600;
            color: #fff !important;
            font-size: 1.2rem;
            transition: opacity 0.2s;
        }
        
        .navbar-brand:hover {
            opacity: 0.8;
        }

        /* Hero Section del Catalogo */
        .hero-catalog {
            background: linear-gradient(135deg, var(--navy) 0%, #0a192f 100%);
            color: white;
            padding: 7rem 1rem 8rem 1rem;
            text-align: center;
            border-bottom: 5px solid var(--legno);
        }

        .hero-catalog h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        /* Barra di Ricerca (Sovrapposta) */
        .search-container {
            margin-top: -2.5rem;
            position: relative;
            z-index: 5;
            margin-bottom: 4rem;
        }

        .search-box {
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 50px;
            overflow: hidden;
            background: white;
        }

        .search-box input {
            border: none;
            box-shadow: none !important;
            padding: 1.2rem 1.5rem;
            font-size: 1.1rem;
        }

        .search-box .input-group-text {
            background: white;
            border: none;
            padding-left: 1.5rem;
            color: var(--navy-light);
            font-size: 1.2rem;
        }

        /* Card dei Movimenti */
        .card-movimento {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            border: none;
            border-top: 4px solid transparent;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .card-movimento:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            border-top: 4px solid var(--legno);
            background-color: var(--accento-hover);
        }

        .card-title {
            color: var(--navy);
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 0.5rem;
        }

        .info-group {
            margin-bottom: 1rem;
        }

        .highlight-label {
            font-weight: 600;
            color: var(--navy-light);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 0.2rem;
        }

        .info-text {
            font-size: 0.95rem;
            color: #444;
            line-height: 1.5;
        }

        /* Footer Contatti */
        footer {
            margin-top: auto;
            padding: 2rem 0;
            background-color: transparent;
        }

        .contact-link {
            color: #0d6efd;
            text-decoration: none;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .contact-link:hover { opacity: 0.7; }

        #contact-info {
            display: none;
            margin-top: 1.5rem;
            animation: slideDown 0.4s ease forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .social-link {
            color: var(--navy);
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .social-link:hover { color: var(--navy-light); }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container">
        <!-- Collegamento corretto alla Homepage -->
        <a class="navbar-brand text-decoration-none" href="Index.html">
            <i class="bi bi-arrow-left me-2"></i> Torna alla Home
        </a>
    </div>
</nav>

<!-- Header Catalogo -->
<header class="hero-catalog">
    <div class="container">
        <h1>Catalogo dei Movimenti</h1>
        <p class="fs-5 opacity-75 font-Montserrat fw-light">Esplora nomi, autori e luoghi della Riforma.</p>
    </div>
</header>

<!-- Contenuto Principale -->
<main class="container mb-5 flex-grow-1">
    
    <!-- Barra di ricerca sovrapposta -->
    <div class="row justify-content-center search-container">
        <div class="col-lg-8 col-md-10">
            <div class="input-group search-box">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="searchInput" class="form-control" placeholder="Cerca per nome, autore o zona geografica..." onkeyup="filterCards()">
            </div>
        </div>
    </div>

    <!-- Griglia dei Risultati -->
    <div class="row g-4" id="catalogGrid">
        <!-- Generato tramite JavaScript -->
    </div>
</main>

<!-- Footer -->
<footer class="text-center">
    <div class="container">
        <span class="contact-link" onclick="toggleContacts()">contatti</span>
        <div id="contact-info">
            <div class="d-flex justify-content-center align-items-center flex-wrap">
                <a href="https://www.instagram.com/lns_luca" target="_blank" class="social-link">
                    <i class="bi bi-instagram fs-5 align-middle me-1"></i> lns_luca
                </a>
                <a href="https://www.tiktok.com/@lns_luca" target="_blank" class="social-link">
                    <i class="bi bi-tiktok fs-5 align-middle me-1"></i> @lns_luca
                </a>
                <a href="mailto:lnsbusiness0@gmail.com" class="social-link">
                    <i class="bi bi-envelope-fill fs-5 align-middle me-1"></i> lnsbusiness0@gmail.com
                </a>
            </div>
        </div>
    </div>
</footer>

<script>
    const movimenti = [
        { nome: "Valdesi", autore: "Pietro Valdo", data: "XII Secolo", diffusione: "Lione (Francia), valli del Piemonte (Italia). Movimento pre-riformatore sopravvissuto fino a oggi." },
        { nome: "Luteranesimo", autore: "Martino Lutero", data: "1517", diffusione: "Germania, Scandinavia, Paesi Baltici dalla prima metà del XVI secolo." },
        { nome: "Zwinglianesimo", autore: "Huldrych Zwingli", data: "1519", diffusione: "Zurigo e principali cantoni della Svizzera tedesca." },
        { nome: "Anabattisti", autore: "Grebel, Manz, Blaurock", data: "1525", diffusione: "Svizzera, Germania meridionale, Paesi Bassi." },
        { nome: "Anglicanesimo", autore: "Enrico VIII", data: "1534", diffusione: "Inghilterra; successivamente diffuso globalmente come Comunione Anglicana." },
        { nome: "Calvinismo", autore: "Giovanni Calvino", data: "1536", diffusione: "Ginevra (Svizzera) dal 1541; Europa (Francia, Paesi Bassi, Scozia, Ungheria, Germania) nella seconda metà del XVI secolo; Nord America nel XVII secolo." },
        { nome: "Puritani", autore: "Movimento di riforma anglicana", data: "XVI Secolo", diffusione: "Inghilterra e colonie del Nord America (Massachusetts)." },
        { nome: "Battisti", autore: "John Smyth / Thomas Helwys", data: "1609", diffusione: "Olanda (origini), Inghilterra e massicciamente negli Stati Uniti dal XVII secolo." },
        { nome: "Giansenisti", autore: "Cornelio Giansenio", data: "1640", diffusione: "Francia e Paesi Bassi. Nota: Corrente cattolica con rigore dottrinale simile al calvinismo." },
        { nome: "Quaccheri", autore: "George Fox", data: "1647", diffusione: "Inghilterra e Nord America (specialmente Pennsylvania)." },
        { nome: "Metodisti", autore: "John Wesley", data: "1738", diffusione: "Gran Bretagna e colonie americane; grande espansione mondiale nel XIX secolo." },
        { nome: "Chiesa Alta / Bassa / Larga", autore: "Correnti dell'Anglicanesimo", data: "XVII-XIX Secolo", diffusione: "Regno Unito e territori dell'Impero Britannico." },
        { nome: "Mormoni", autore: "Joseph Smith", data: "1830", diffusione: "Stati Uniti (New York, poi Utah); diffusione globale nel XX secolo." },
        { nome: "Pentecostali", autore: "Charles Parham / William Seymour", data: "1901", diffusione: "USA (Kansas e Los Angeles); massiccia diffusione globale in America Latina, Africa e Corea." },
        { nome: "Evangelici", autore: "Vari (Movimento di risveglio)", data: "XVIII Secolo", diffusione: "Gran Bretagna e USA; oggi diffusi globalmente in modo trans-denominazionale." }
    ];

    function renderCatalog(data) {
        const grid = document.getElementById('catalogGrid');
        
        if(data.length === 0) {
            grid.innerHTML = '<div class="col-12 text-center py-5 text-muted"><i class="bi bi-search fs-1"></i><p class="mt-3">Nessun movimento trovato per la tua ricerca.</p></div>';
            return;
        }

        grid.innerHTML = data.sort((a,b) => a.nome.localeCompare(b.nome)).map(m => `
            <div class="col-md-6 col-lg-4">
                <div class="card-movimento">
                    <h3 class="card-title">${m.nome}</h3>
                    
                    <div class="info-group">
                        <span class="highlight-label"><i class="bi bi-person-fill me-1"></i> Autore / Iniziatore</span>
                        <div class="info-text">${m.autore}</div>
                    </div>
                    
                    <div class="info-group">
                        <span class="highlight-label"><i class="bi bi-calendar-event me-1"></i> Datazione</span>
                        <div class="info-text">${m.data}</div>
                    </div>
                    
                    <div class="info-group mt-auto">
                        <span class="highlight-label"><i class="bi bi-globe-americas me-1"></i> Diffusione</span>
                        <div class="info-text text-muted">${m.diffusione}</div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function filterCards() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = movimenti.filter(m => 
            m.nome.toLowerCase().includes(term) || 
            m.autore.toLowerCase().includes(term) || 
            m.diffusione.toLowerCase().includes(term)
        );
        renderCatalog(filtered);
    }

    function toggleContacts() {
        const info = document.getElementById('contact-info');
        if (info.style.display === 'block') {
            info.style.display = 'none';
        } else {
            info.style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    }

    // Inizializza il catalogo al caricamento
    renderCatalog(movimenti);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
